<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date?</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at top, #ffeef6, #ffd6e7);
  font-family: system-ui, sans-serif;
  padding: 16px;
}
.card {
  width: min(420px, 92vw);
  padding: 28px 22px;
  background: #ffffffcc;
  backdrop-filter: blur(10px);
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 18px 50px rgba(0,0,0,.12);
}
h1 { font-size: 28px; margin: 0 0 20px; }
.buttons {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 12px;
}
button {
  padding: 14px 28px;
  font-size: 17px;
  font-weight: 700;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
#yesBtn { background: #ff3b7a; color: white; }
#noBtn  { background: #e5e7eb; color: #111; }
#coffeeBtn { background: #6fd77d; color: white; }
#wineBtn   { background: #ff6b6b; color: white; }
.hidden { display: none; }
.result h2 { font-size: 32px; margin: 10px 0; }
.message { font-size: 20px; color: #ff3b7a; margin-top: 16px; font-weight: 600; }
</style>
</head>
<body>
<main class="card">
  <div id="step1">
    <h1>Muney, Date Janey ho? 😌</h1>
    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <div id="step2" class="hidden result">
    <h2>YAY! 🎉</h2>
    <p style="margin: 12px 0 8px;">Coffee date ki Wine date?</p>
    <div class="buttons">
      <button id="coffeeBtn">Coffee</button>
      <button id="wineBtn">Wine</button>
    </div>
  </div>

  <div id="step3" class="hidden">
    <h2 id="finalMsg" class="message"></h2>
  </div>
</main>

<script>
const step1 = document.getElementById('step1');
const step2 = document.getElementById('step2');
const step3 = document.getElementById('step3');
const finalMsg = document.getElementById('finalMsg');

document.getElementById('yesBtn').onclick = () => {
  step1.classList.add('hidden');
  step2.classList.remove('hidden');
  confetti({ particleCount: 120, spread: 100, origin: { y: 0.6 } });
};

document.getElementById('noBtn').onclick = (e) => {
  e.preventDefault();
  // No button does nothing (same as original shy behaviour)
};

document.getElementById('coffeeBtn').onclick = () => {
  step2.classList.add('hidden');
  step3.classList.remove('hidden');
  finalMsg.textContent = 'A cold frappe is coming for you 🍹';
  confetti({ particleCount: 100, spread: 90, origin: { y: 0.6 } });
};

document.getElementById('wineBtn').onclick = () => {
  step2.classList.add('hidden');
  step3.classList.remove('hidden');
  finalMsg.textContent = 'Chardonnay is gonna die for you 🍷';
  confetti({ particleCount: 100, spread: 90, origin: { y: 0.6 } });
};
</script>
</body>
</html>
